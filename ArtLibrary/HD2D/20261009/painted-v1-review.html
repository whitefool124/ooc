<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#202a2f;color:#eee6d6;font:16px/1.65 'Microsoft YaHei',sans-serif}main{max-width:1500px;margin:auto;padding:32px}h1{font-size:30px;font-weight:500;margin:0}p{color:#abbec2;max-width:900px}header{margin-bottom:28px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:24px}button,a{color:inherit}button{font:inherit;background:#34474e;border:1px solid #53696e;border-radius:8px;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#d9d0bc;color:#253338}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:#293338;border-radius:12px;padding:22px;overflow:hidden}.card h2{font-size:21px;font-weight:500;margin:0}.stage{position:relative;margin:20px auto 12px;width:100%;aspect-ratio:1.65;display:flex;align-items:center;justify-content:center;background:#293338}.stage.checker{background:repeating-conic-gradient(#303b40 0% 25%,#465056 0% 50%) 50%/32px 32px}.stage.light{background:#c1c6c5}.asset{position:relative;max-width:100%;max-height:100%;line-height:0}.asset img{display:block;width:100%;height:100%;object-fit:contain}.writing{position:absolute;color:#423d34;line-height:1.6;font-size:clamp(10px,1.05vw,16px);overflow:hidden;display:none;padding:1%;text-align:left}.writing b{display:block;font-size:1.1em;margin-bottom:8px}.with-text .writing{display:block}.writing.short{align-content:center;text-align:center;font-size:clamp(16px,1.4vw,22px)}.links{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}.links a{color:#b8d2d6;text-underline-offset:4px}.meta{font-size:13px;color:#91aab0;margin:10px 0}.hint{font-size:14px;margin:8px 0;color:#afbec2}footer{padding:32px 0;color:#a8b8bc}footer a{color:#c9dadd}@media(max-width:800px){main{padding:18px}.grid{grid-template-columns:1fr}.writing{font-size:12px}.writing.short{font-size:17px}}
</style>
<main><header><h1>OCC · HD2D 可复用素材库 / 01</h1><p>统一纸黄、胡桃木、低饱和青蓝和克制黄铜。每件独立透明，正面承载区朝向摄影机；物件保留厚度和材质明暗。第一批 8 件，素材评审版。</p><div class="tools"><button id="text" aria-pressed="false">显示文字承载示例</button><button data-bg="dark" aria-pressed="true">中性深底</button><button data-bg="light" aria-pressed="false">浅色背景</button><button data-bg="checker" aria-pressed="false">检查透明边缘</button><a href="contact-sheet.jpg">打开总览图</a></div></header><div class="grid" id="grid"></div><footer>保留原始生图、透明交付图、处理记录、哈希与 1× / 4× / 灰阶 / 棋盘检查图。这里的文字是浏览器实时叠加示例，没有烘焙到美术中。<br>当前状态：QA_PENDING。尚未完成 Unity 场景接触、运行时打光、导入与人工审美验收。<br><a href="README.md">用途与复用说明</a> · <a href="batch-manifest.json">批次溯源</a></footer></main>
<script>
const items=[
{id:'dossier',name:'展开档案册',w:1526,h:875,use:'角色档案、图鉴、结算、长篇记录。双页布局复用，正文可滚动或分页。',areas:[[.105,.13,.34,.70],[.565,.13,.335,.70]],text:['<b>学生档案</b>学院登记册<br>身份与履历<br><br>记录以太素研究与实习经历。','<b>能力记录</b>个人术式<br>装备与专长<br><br>正文、插图和条目由界面实时排版。']},
{id:'notes',name:'装订便笺',w:1467,h:846,use:'事件说明、任务摘要、服务说明、短列表。长文本通过换页复用同一物件。',areas:[[.12,.22,.74,.60]],text:['<b>装订记录</b>今日事项<br>一、检查设备<br>二、整理实验记录<br>三、领取学院补给']},
{id:'plaque',name:'悬挂铭牌',w:1667,h:716,use:'场所名称、页签、入口按钮。整体等比缩放，安装点在横梁。',areas:[[.16,.39,.68,.44]],text:['学院工坊'],short:true},
{id:'price_tag',name:'商品吊牌',w:1412,h:964,use:'价格、数量、状态、奖励说明。配合独立商品精灵复用。',areas:[[.20,.51,.60,.34]],text:['校准耗材<br>说明 · 数量'],short:true},
{id:'service_label',name:'桌面服务牌',w:1507,h:664,use:'服务动作、确认入口、购买与返回。使用搪瓷承载面，脚座保持接触。',areas:[[.17,.24,.66,.40]],text:['查看记录'],short:true},
{id:'cloth_display',name:'布垫陈列座',w:1494,h:607,use:'奖励、商店、装备及工坊物件展示。中央空区用于组合商品，说明挂在旁边。',areas:[],text:[]},
{id:'tool_rack',name:'校准工具架',w:1423,h:973,use:'工坊、实验室、装备校准。当前为整件装饰物，工具拆分须独立生产，不能伪造取用动画。',areas:[],text:[]},
{id:'apothecary',name:'药剂收纳提箱',w:1451,h:1002,use:'治疗、补给、医务室。与便笺和服务牌组合，说明文字不压在瓶罐上。',areas:[],text:[]}
];
const grid=document.querySelector('#grid');
for(const x of items){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${x.name}</h2><div class="stage"><div class="asset" style="aspect-ratio:${x.w}/${x.h};width:min(100%,${x.w/x.h>1.65?'100%':(x.w/x.h/1.65*100)+'%'})"><img src="${x.id}/delivery.png" alt="${x.name}">${x.areas.map((a,i)=>`<div class="writing ${x.short?'short':''}" style="left:${a[0]*100}%;top:${a[1]*100}%;width:${a[2]*100}%;height:${a[3]*100}%">${x.text[i]}</div>`).join('')}</div></div><p class="hint">${x.use}</p><div class="meta">${x.w} × ${x.h} · RGBA · 原料与交付分开保留</div><div class="links"><a href="${x.id}/delivery.png">透明交付图</a><a href="${x.id}/source-01.png">生成原料</a><a href="${x.id}/qa/checker.png">透明检查</a><a href="${x.id}/manifest.json">来源与处理</a></div>`;grid.append(card);}
document.querySelector('#text').onclick=function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);grid.classList.toggle('with-text',on);};
for(const b of document.querySelectorAll('[data-bg]'))b.onclick=()=>{for(const other of document.querySelectorAll('[data-bg]'))other.setAttribute('aria-pressed',other===b);for(const stage of document.querySelectorAll('.stage'))stage.className='stage '+b.dataset.bg;};
</script></html>
