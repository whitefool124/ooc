<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>OCC 主界面 E 开书演出预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#201e1a;color:#f2eadb;font-family:system-ui}header{display:flex;align-items:center;gap:14px;padding:12px 20px;font-size:14px}header button{padding:6px 12px;background:#373129;color:#f3ebdd;border:1px solid #857b66;cursor:pointer}.stage{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative;background:#d4bb8d}.room{position:absolute;inset:0;background:url(background_r2_source.png) center/cover;image-rendering:pixelated}.props{position:absolute;inset:0}.prop{position:absolute;image-rendering:pixelated;object-fit:contain}.lamp{left:88%;bottom:13%;width:6%}.cup{left:73%;bottom:11%;width:10%}.banner{right:10%;top:4%;width:7%;transform-origin:top;animation:sway 7s ease-in-out infinite}.book{position:absolute;left:43%;bottom:8%;width:24%;height:23%;z-index:4;transform-origin:center;transition:left .45s,bottom .45s,width .9s,height .9s}.book img{position:absolute;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.open{opacity:0}.title{position:absolute;top:9%;left:6%;width:22%;text-align:center;color:#23334a;font-size:clamp(36px,7vw,112px);font-family:serif;letter-spacing:.12em}.menu{position:absolute;left:4%;bottom:9%;width:26%;padding:2% 1.5%;background:#f1e5cc;border:1px solid #a79370;z-index:5;transition:opacity .2s}.menu button{display:block;width:100%;padding:6% 0;background:transparent;border:0;border-bottom:1px solid #c3b396;color:#352e28;font:clamp(16px,2.2vw,36px) serif;cursor:pointer}.menu button:hover,.menu button:focus-visible{color:#1c7782;outline:1px solid #328b95}.menu button.main{border:1px solid #aa8d56;margin-bottom:5%;background:#ede0be}.menu button:last-child{border-bottom:0}.steam{position:absolute;left:78%;bottom:31%;width:4px;height:14px;background:#fff7df;opacity:.3;animation:steam 3s infinite}.steam.s2{animation-delay:1.2s}.destination{display:none;position:absolute;inset:12% 16%;z-index:10;background:#f4ecd8;color:#322c25;padding:7% 8%;text-align:center}.destination h2{font-size:clamp(24px,3vw,48px)}.destination p{font-size:clamp(16px,1.8vw,28px)}.destination button{padding:12px 32px;background:#e9ddc0;border:1px solid #a18b65;font-size:20px;cursor:pointer}.opening .menu,.opening .title{opacity:0;pointer-events:none}.opening .book{left:10%;bottom:10%;width:80%;height:80%}.opening .closed{animation:cover .6s .35s forwards;transform-origin:10% center}.opening .open{animation:reveal .1s .65s forwards}.calm *{animation:none!important}.calm .book{transition:none}.calm.opening .closed{opacity:0}.calm.opening .open{opacity:1}@keyframes sway{50%{transform:rotate(1deg)}}@keyframes steam{to{transform:translate(8px,-50px);opacity:0}}@keyframes cover{to{transform:perspective(600px) rotateY(-90deg);opacity:0}}@keyframes reveal{to{opacity:1}}
.room{background-image:url(coherent_scene_concept.png);transform-origin:51% 86%;transition:transform .9s steps(12)}
.room:after{content:"";position:absolute;inset:0;background:url(coherent_open_concept.png) center/cover;opacity:0;transition:opacity .3s .4s}
.props,.title,.book{display:none}.menu{background:none;border:0}.menu button,.menu button.main{color:transparent;border-color:transparent;background:none}.menu button:hover,.menu button:focus-visible{background:#ffffff18;outline:1px solid #328b9566;color:transparent}.menu #resume{position:absolute;top:-70px;color:#352e28;background:#f1e5cc;border:1px solid #aa8d56;padding:12px}.opening .room{transform:scale(2)}.opening .room:after{opacity:1}.calm .room,.calm .room:after{transition:none}
</style></head><body>
<header><span>E 整场景母图预览 · 尚未通过正式网格验收</span><button id="state">切换为有未完成轮次</button><button id="motion">关闭动画</button><button id="reset">返回首页</button></header>
<div class="stage" id="stage"><div class="room"></div><div class="props">
<img class="prop lamp" src="05_aether_lamp/four_x.png"><img class="prop cup" src="04_cup_r2/four_x.png"><img class="prop banner" src="06_banner/four_x.png"><div class="steam"></div><div class="steam s2"></div>
</div><div class="title">以太</div><div class="book"><img class="open" src="03_open_book_r2/four_x.png"><img class="closed" src="02_closed_book/four_x.png"></div>
<nav class="menu"><button class="main" id="resume" hidden>继续游戏</button><button class="main" id="start">开始游戏</button><button id="archive">行程与行囊</button><button id="settings">设置</button><button id="quit">退出游戏</button></nav>
<section class="destination" id="destination"><h2 id="heading"></h2><p id="detail"></p><button id="back">返回首页</button></section></div>
<script>
const stage=document.getElementById('stage'),dest=document.getElementById('destination');let busy=false,active=false,animation=true,timer;
function reset(){clearTimeout(timer);busy=false;stage.classList.remove('opening');dest.style.display='none'}
function enter(title,detail,book){if(busy)return;busy=true;const show=()=>{document.getElementById('heading').textContent=title;document.getElementById('detail').textContent=detail;dest.style.display='block'};if(book){stage.classList.add('opening');timer=setTimeout(show,animation?1250:0)}else show()}
document.getElementById('start').onclick=()=>enter('选择主角','开始游戏进入角色选择，确认前不创建或覆盖轮次。',true);
document.getElementById('resume').onclick=()=>enter('恢复未完成轮次','继续游戏恢复最近保存的实际流程，不重新选择角色。',true);
document.getElementById('archive').onclick=()=>enter('行程与行囊','查看已保存的旅程记录。',false);
document.getElementById('settings').onclick=()=>enter('设置','声音、显示与动画设置。',false);
document.getElementById('quit').onclick=()=>enter('退出游戏','此处仅演示菜单，不关闭浏览器。',false);
document.getElementById('back').onclick=reset;document.getElementById('reset').onclick=reset;
document.getElementById('state').onclick=()=>{reset();active=!active;document.getElementById('resume').style.display=active?'block':'none';document.getElementById('state').textContent=active?'切换为无未完成轮次':'切换为有未完成轮次'};
document.getElementById('resume').style.display='none';
document.getElementById('motion').onclick=()=>{animation=!animation;stage.classList.toggle('calm',!animation);document.getElementById('motion').textContent=animation?'关闭动画':'开启动画'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});
</script></body></html>
