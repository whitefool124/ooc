<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>以太 · 地图、任务与战利品</title>
<style>body{margin:0;background:#211a14;color:#f1e5ca;font:16px/1.65 system-ui}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:26px}p,figcaption{color:#c8bda7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{border:1px solid #8c7655;background:#34281d;color:#eee0c5;padding:10px 18px;cursor:pointer}button[aria-pressed=true]{background:#e8d8b5;color:#2c241b}button:focus-visible{outline:3px solid #8cbbba}figure{margin:0}img{display:block;width:100%;image-rendering:pixelated}figcaption{padding:12px 0}a{color:#e8d8b5}</style>
<main><h1>以太 · 地图、任务与战利品</h1><p>Unity 1920×1080 实际截图。任务文件、地图节点、奖励工作台继续深化，纸页增加统一的硬边接触阴影。</p><nav id="pages" aria-label="界面预览"></nav><figure><img id="preview" src="paper-departure.png" alt="任务文件"><figcaption id="caption">任务文件：左侧任务摘要，右侧目标与场地，底部整备与出发。</figcaption></figure><p><a href="reset-review.html">查看其余战斗外页面与开书录屏</a></p><details><summary>本轮验证范围</summary><p>编译通过，最终 Console 无错误。Play Mode 的真实按钮与命中检查已通过地图节点、固定金币、学院贡献、打开封套、选取卡牌、领取与离开。奖励使用隔离测试状态，这些检查不代表完整战斗通关。没有替换玩家存档，没有保存场景。本轮没有新增生图资产。</p><p>地图已按用户确认移除常驻百科入口，阶段显示学院。总案 5.1.24 仍有旧的地图百科入口句子，待文档口径同步；本轮没有扩大产品规则。</p></details></main>
<script>const pages=[['任务文件','departure','任务文件：左侧任务摘要，右侧目标与场地，底部整备与出发。'],['学院地图','map','地图节点去掉叠加的方形装饰框，区域标签提高对比度；点击可打开任务文件。'],['战利品工作台','reward','待领取物件与背包分区，封套名称和容量完整显示。'],['奖励三选一','three-cards','大图标、名称和关键效果直接并排呈现，点击选择后回到封套领取。'],['装备背包','backpack','共用书桌场景、浅色纸页与接触阴影。']];const nav=document.getElementById('pages');for(const [label,key,caption] of pages){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',key==='departure');b.onclick=()=>{document.getElementById('preview').src='paper-'+key+'.png';document.getElementById('preview').alt=label;document.getElementById('caption').textContent=caption;for(const x of nav.children)x.setAttribute('aria-pressed',x===b)};nav.appendChild(b)}</script></html>
