<style>body{margin:0;background:#201c18;color:#eee0c6;font:16px/1.6 system-ui}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:24px}p{color:#c3b49d}button{background:#ddc99f;color:#282018;border:0;padding:10px 24px;margin:0 10px 16px 0;cursor:pointer}button[aria-pressed=true]{outline:2px solid #fff1cd}img,video{display:block;width:100%;image-rendering:pixelated}.videos{display:grid;grid-template-columns:1fr 1fr;gap:20px}a{color:#ddc99f}@media(max-width:800px){.videos{grid-template-columns:1fr}}</style>
<main><h1>以太 · 场景打磨</h1><p>按 game-visual-polish、pixel-art-specification、game-ui-design 审阅实际画面与开书动画：窗光限定在桌面平面，书页与器物共用主光；收紧菜单纸页和行间距。</p>
<button id="before" aria-pressed="false">上一版</button><button id="after" aria-pressed="true">本轮优化</button><img id="scene" src="skills-after.png" alt="本轮优化实际截图">
<div class="videos"><section><p>开始游戏 → 开书 → 角色配置</p><video controls preload="metadata" src="skills-start.mp4" poster="skills-after.png"></video></section><section><p>继续游戏 → 开书 → 恢复学院地图</p><video controls preload="metadata" src="skills-continue.mp4" poster="skills-continue.png"></video></section></div>
<p>实际场景六区域仍为统一 6px 显示网格。当前书本开合仍使用两张独立姿态的过渡，尚无连续翻页帧。<a href="modular-review.html">独立资产组合记录</a></p></main>
<script>for(const key of ['before','after'])document.getElementById(key).onclick=()=>{document.getElementById('scene').src='skills-'+key+'.png';for(const k of ['before','after'])document.getElementById(k).setAttribute('aria-pressed',k===key)};</script></html>
