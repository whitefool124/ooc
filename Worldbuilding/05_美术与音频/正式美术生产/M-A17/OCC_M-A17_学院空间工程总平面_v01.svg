  <!-- title block -->
  <g transform="translate(180 1060)"><rect width="1536" height="104" fill="#0d3b58" stroke="#dff8ff" stroke-width="2"/><path d="M1010 0V104M1270 0V104" class="thin"/><text x="22" y="32" class="ink" font-size="22" font-weight="700">M-A17  学院空间工程总平面</text><text x="22" y="57" class="sub" font-size="13">MODEL GUIDANCE / MAP COORDINATE 1536×864 / ORIGIN: TOP-LEFT / UNIT: MAP PX</text><text x="22" y="80" class="sub" font-size="12">蓝图只定义固定地理与可替换模块；40 节点、路线及状态继续由同相机投影的 UGUI 动态生成。</text><text x="1030" y="32" class="ink" font-size="14">ISSUE</text><text x="1030" y="58" class="sub" font-size="13">01 · 2026-08-18</text><text x="1290" y="32" class="ink" font-size="14">STATUS</text><text x="1290" y="58" class="sub" font-size="13">CENTRAL LIBRARY / PENDING IMPLEMENTATION</text><text x="1290" y="80" class="sub" font-size="12">do not bake nodes or routes into mesh</text></g>
