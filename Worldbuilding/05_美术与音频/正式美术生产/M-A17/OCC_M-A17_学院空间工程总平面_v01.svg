    <text x="155" y="166">01</text><text x="155" y="262">02</text><text x="155" y="358">03</text><text x="155" y="454">04</text><text x="155" y="550">05</text><text x="155" y="646">06</text><text x="155" y="742">07</text><text x="155" y="838">08</text><text x="155" y="934">09</text><text x="155" y="1024">10</text></g>

