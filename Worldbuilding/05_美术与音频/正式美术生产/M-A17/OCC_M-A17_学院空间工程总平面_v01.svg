<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">OCC M-A17 学院空间工程总平面</title>
  <desc id="desc">用于指导运行时模块化建模的学院地图总平面。包含地图坐标、建筑稳定 ID、占地尺寸、道路等级、桥梁和中央图书馆控制关系。</desc>
  <defs>
    <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2a6582" stroke-width="0.7"/></pattern>
    <pattern id="major" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="url(#minor)"/><path d="M96 0H0V96" fill="none" stroke="#79bed6" stroke-width="1.3"/></pattern>
    <style>
      .ink{fill:#e9fbff;font-family:Consolas,'Microsoft YaHei',sans-serif}.sub{fill:#9bcce0;font-family:Consolas,'Microsoft YaHei',sans-serif}.line{fill:none;stroke:#dff8ff;stroke-width:2}.thin{fill:none;stroke:#8fc9dc;stroke-width:1}.dash{fill:none;stroke:#89d9ee;stroke-width:1.5;stroke-dasharray:7 5}.roadA{fill:none;stroke:#e1f8ff;stroke-width:16;stroke-linecap:square;stroke-linejoin:miter}.roadB{fill:none;stroke:#8dcce0;stroke-width:9;stroke-linecap:square;stroke-linejoin:miter}.roadC{fill:none;stroke:#5b9bb4;stroke-width:4;stroke-linecap:square}.building{fill:#174f6d;stroke:#e3f8ff;stroke-width:2}.library{fill:#1c607f;stroke:#ffffff;stroke-width:3}.roof{fill:none;stroke:#75cbe4;stroke-width:2}.dim{fill:none;stroke:#89d9ee;stroke-width:1}.label{fill:#e9fbff;font-family:Consolas,'Microsoft YaHei',sans-serif;font-size:13px}.small{fill:#a8d8e8;font-family:Consolas,'Microsoft YaHei',sans-serif;font-size:11px}.note{fill:#a8d8e8;font-family:Consolas,'Microsoft YaHei',sans-serif;font-size:12px}
    </style>
  </defs>
  <rect width="1920" height="1200" fill="#092f4a"/>
  <rect x="180" y="160" width="1536" height="864" fill="url(#major)" stroke="#dff8ff" stroke-width="2"/>

