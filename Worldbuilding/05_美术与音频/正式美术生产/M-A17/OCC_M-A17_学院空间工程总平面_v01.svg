  <!-- central library: proposed target and first construction control -->
  <g>
    <rect x="820" y="500" width="260" height="190" class="library"/><circle cx="950" cy="595" r="65" fill="none" stroke="#fff" stroke-width="3"/><path d="M885 595Q950 515 1015 595M870 628H1030" class="roof"/><path d="M950 500V690M820 595H1080" class="thin"/>
