    <path class="water" d="M680 492V420H1015"/><path class="drain" d="M1230 620H1290V690"/>
    <text class="t" x="50" y="728">棚市火源与医务药材分离；每96m设置8–16m阻火线，后巷保持担架和泵车通行。</text>
  </g>

  <g transform="translate(60 1730)">
    <rect class="box" width="2880" height="300"/><text class="h" x="30" y="42">D01-E｜门区平面控制｜门洞10m＋双检查院＋桥台独立</text>
    <path class="road" d="M90 150H940" stroke-width="70"/><rect class="b" x="420" y="85" width="80" height="130"/><rect class="b" x="530" y="85" width="80" height="130"/><rect class="yard" x="650" y="70" width="250" height="75"/><rect class="yard" x="650" y="160" width="250" height="75"/><text class="s" x="675" y="115">入城检查院</text><text class="s" x="675" y="205">出城／消防通道</text>
    <path d="M960 90h290v120H960" fill="#cbeaf4" stroke="#5798ba" stroke-width="3"/><path class="road" d="M900 150H1320" stroke-width="54"/><text class="s" x="1010" y="65">外壕 18–24m</text>
    <line x1="1450" y1="55" x2="1450" y2="245" stroke="#4f88a8" stroke-width="2"/>
    <text class="t" x="1500" y="90">城门守备：每门 18–28 人常班；门楼 3–4F、有效高≤20m。</text><text class="t" x="1500" y="128">检查院不堵主轴；关闭主门后侧门仍可供人员疏散和消防。</text><text class="t" x="1500" y="166">桥台、门楼和墙段分件替换；门前回转场直径≥24m。</text><text class="t" x="1500" y="204">门区住宅不得进入内侧32m清障带；临时棚可拆、不得作为永久街坊。</text>
