      <rect class="b" x="70" y="190" width="82" height="165"/><rect class="b" x="160" y="190" width="70" height="165"/><rect class="b" x="238" y="190" width="96" height="165"/><rect class="b" x="342" y="190" width="74" height="165"/><rect class="b" x="424" y="190" width="88" height="165"/><rect class="b" x="520" y="190" width="75" height="165"/>
