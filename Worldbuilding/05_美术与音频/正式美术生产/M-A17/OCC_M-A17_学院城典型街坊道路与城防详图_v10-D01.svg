  <g transform="translate(1560 130)">
    <rect class="box" width="1380" height="760"/><rect class="grid" x="20" y="60" width="1340" height="680"/><text class="h" x="30" y="40">D01-B｜AR-A 学院围院｜224×176m｜覆盖率 30–40%</text>
    <rect class="b" x="90" y="120" width="1160" height="110"/><text class="t" x="540" y="185">主讲堂翼 3F / 屋脊≤18m</text>
    <rect class="b" x="90" y="250" width="150" height="360"/><rect class="b" x="1100" y="250" width="150" height="360"/>
    <rect class="yard" x="270" y="270" width="800" height="300"/><text class="t" x="585" y="410">中央院 128×48m</text><text class="s" x="530" y="442">集会、采光、消防与疏散</text>
    <rect class="b" x="270" y="590" width="260" height="90"/><rect class="b" x="810" y="590" width="260" height="90"/><rect class="fire" x="550" y="590" width="240" height="90"/><text class="s" x="592" y="642">对向双门 ≥4.5m</text>
