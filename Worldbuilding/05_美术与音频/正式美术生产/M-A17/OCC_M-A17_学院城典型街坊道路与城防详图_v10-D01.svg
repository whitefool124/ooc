    <text class="t" x="50" y="728">废料院设遮雨、编号和石地坪；危险工房位于居住区下风侧，不共享井与生活排水。</text>
  </g>

  <g transform="translate(1560 930)">
    <rect class="box" width="1380" height="760"/><rect class="grid" x="20" y="60" width="1340" height="680"/><text class="h" x="30" y="40">D01-D｜市集＋医务消防街坊｜224×176m｜覆盖率 38–50%</text>
    <rect class="b" x="80" y="120" width="500" height="110"/><rect class="b" x="80" y="250" width="500" height="110"/><text class="t" x="250" y="190">市场棚列</text><text class="t" x="250" y="320">行会铺面</text>
    <rect class="fire" x="610" y="100" width="150" height="550"/><text class="s" x="642" y="350">16m</text><text class="s" x="627" y="375">消防间隔</text>
    <path class="b" d="M800 120h430v500H800z"/><path class="roof" d="M800 120h430M1015 120v500M800 365h430"/><text class="t" x="900" y="250">医务院四翼</text><text class="s" x="900" y="285">独立药材仓与担架门</text>
