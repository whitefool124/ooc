    <rect class="road" x="70" y="380" width="525" height="66"/><rect class="road" x="755" y="380" width="555" height="66"/><text class="s" x="240" y="420">4–5m 后巷 / 清运</text><text class="s" x="940" y="420">4–5m 后巷 / 清运</text>
    <rect class="fire" x="595" y="175" width="30" height="493"/><rect class="fire" x="721" y="175" width="34" height="493"/><text class="s" x="510" y="705">6m 防火缝</text><text class="s" x="735" y="705">转角＋消防取水点</text>
    <text class="t" x="50" y="728">单栋典型 6–10×14–22m；2–3F；一户或一户＋临街铺。不得合成连续板楼。</text>
