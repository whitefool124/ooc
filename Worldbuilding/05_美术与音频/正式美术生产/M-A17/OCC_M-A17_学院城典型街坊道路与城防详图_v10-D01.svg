  <rect class="p" width="3000" height="2100"/><text class="title" x="60" y="58">OCC 学院城典型街坊、道路与城防详图 · v10-D01</text><text class="t" x="60" y="94">用于模块化建模；所有尺寸为米。重复房屋按区域生成，但每栋仍保留独立基础、屋脊、入口与防火分段。</text>

