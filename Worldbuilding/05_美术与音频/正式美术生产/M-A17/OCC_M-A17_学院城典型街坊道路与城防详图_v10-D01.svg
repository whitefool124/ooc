    <path class="b" d="M80 140h540v180H80z"/><path class="roof" d="M80 140l70-45 70 45 70-45 70 45 70-45 70 45 70-45 70 45"/><text class="t" x="250" y="235">长跨冷作／装配工房 1–2F</text>
    <rect class="b" x="720" y="120" width="520" height="200"/><text class="t" x="855" y="220">材料库 1–2F</text>
    <rect class="yard" x="80" y="370" width="740" height="250"/><text class="t" x="300" y="490">设备院 / 事故回转场</text><text class="s" x="285" y="522">净空 32m；石地坪；不设住宅</text>
    <rect class="b" x="860" y="370" width="180" height="250"/><text class="s" x="895" y="490">监管仓</text><rect class="b" x="1060" y="370" width="180" height="250"/><text class="s" x="1095" y="490">消防所</text>
