  <g transform="translate(120 1050)"><rect width="1536" height="95" fill="#0d3b58" stroke="#e9fbff" stroke-width="2"/><path d="M1040 0V95M1280 0V95" class="d"/><text x="20" y="31" class="t" font-size="21" font-weight="700">M-A17 · ORTHOGONAL MODEL CONTROL PLAN</text><text x="20" y="57" class="m" font-size="13">ALL BUILDING FACADES ALIGN TO 48-UNIT GRID. ROADWAY MUST NOT CROSS ANY BUILDING FOOTPRINT.</text><text x="20" y="78" class="m" font-size="12">LIBRARY RING CLEARANCE: 60 MINIMUM. DYNAMIC NODES / ROUTES REMAIN UGUI, NOT MESH.</text><text x="1060" y="35" class="t" font-size="13">ISSUE 02</text><text x="1060" y="60" class="m" font-size="12">2026-08-18</text><text x="1300" y="35" class="t" font-size="13">STATUS</text><text x="1300" y="60" class="m" font-size="12">BLUEPRINT / IMPLEMENTATION PENDING</text></g>
