<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">OCC M-A17 学院空间工程总平面 v02 正交整理版</title>
  <desc id="desc">按 48 单位模数整理的建模蓝图。中央图书馆外设完整道路环，建筑和道路均与主网格平行或垂直。</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2d6886" stroke-width="1"/></pattern>
    <style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#e9fbff}.m{font-family:Consolas,'Microsoft YaHei',sans-serif;fill:#acd9e9}.b{fill:#15516f;stroke:#e9fbff;stroke-width:2}.lib{fill:#1b6686;stroke:#fff;stroke-width:3}.r1{fill:none;stroke:#e8fbff;stroke-width:18}.r2{fill:none;stroke:#90cfe2;stroke-width:10}.r3{fill:none;stroke:#5c9eb8;stroke-width:5}.d{fill:none;stroke:#7dd5ed;stroke-width:1.5;stroke-dasharray:7 5}</style>
  </defs>
  <rect width="1920" height="1200" fill="#082f4a"/>
  <text x="120" y="74" class="t" font-size="30" font-weight="700">M-A17 学院空间工程总平面</text>
  <text x="120" y="105" class="m" font-size="15">ISSUE 02 / 正交整理版 / 坐标原点：左上 / 单位：MAP PX / 模数：48</text>
