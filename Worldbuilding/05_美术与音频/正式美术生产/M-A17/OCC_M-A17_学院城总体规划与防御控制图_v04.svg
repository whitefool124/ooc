<g transform="translate(80 1360)"><rect width="2112" height="132" fill="#103d57" stroke="#d6f4fc" stroke-width="2"/><text x="22" y="30" class="t" font-size="18" font-weight="700">DEFENCE SYSTEM REGISTER</text><text x="22" y="57" class="m" font-size="14">D-01 rampart and maintenance walk · G-01..04 sector gates · T-01..08 watch/signal towers · S-01..06 provisional relay sites · P-01 port quarantine · L-01 cart-road logistics buffer · X-01 sealed cordon.</text><text x="22" y="83" class="m" font-size="14">All measures are maintainable pre-industrial aether engineering. Relays are planning sites, not a public shield network; no new combat, time, permit, route, node, or save-state rule is implied.</text><text x="22" y="108" class="m" font-size="14">v04 supersedes the campus-only v03 as city master-plan guidance. v03 remains the detailed inner-campus construction sheet until individual outer-city modules receive runtime IDs.</text></g>
