function renderOverview(){let current=data.tasks.find(t=>t.status==='current'),next=data.tasks.filter(t=>t.status==='next'),missing=data.gaps.filter(g=>g.status==='missing').length;$('#overview').innerHTML=`<div class="hero"><article class="card current"><div class="eyebrow">当前唯一主任务 · ${esc(current.id)}</div><h2>${esc(current.name)}</h2><p>${esc(current.desc)}</p><div class="chips"><span class="chip">${esc(current.mode)}</span><span class="chip">${esc(current.priority)}</span><span class="chip">下一步：${esc(current.next)}</span></div><button class="action" data-goto="tasks">打开验收与看板</button></article><article class="card"><div class="eyebrow">下一步行动</div><ul class="list">${next.slice(0,3).map(t=>`<li class="row"><i class="dot"></i><div><strong>${esc(t.id)} · ${esc(t.name)}</strong><small>${esc(t.next)}</small></div></li>`).join('')}</ul></article></div><div class="grid"><article class="card metric"><small>当前任务</small><b class="up">1</b><small>严格限制单一主任务</small></article><article class="card metric"><small>待补资产/系统</small><b class="warn">${missing}</b><small>优先绑定到开发任务</small></article><article class="card metric"><small>已登记资产</small><b>${data.assets.length}</b><small>含正式资源与概念参考</small></article><article class="card metric"><small>活跃风险</small><b class="warn">${data.risks.length}</b><small>其中高风险 ${data.risks.filter(r=>r.level==='high').length} 项</small></article></div><div class="section-title"><h2>下一步路径</h2><span>验收当前项后才推进</span></div><div class="two"><article class="card"><ul class="list">${data.tasks.slice(0,5).map((t,i)=>`<li class="row"><i class="dot ${i===0?'current':i<4?'warn':''}"></i><div><strong>${esc(t.id)} · ${esc(t.name)}</strong><span>${esc(t.accept)}</span></div></li>`).join('')}</ul></article><article class="card"><div class="eyebrow">开发护栏</div><ul class="list"><li class="row"><i class="dot current"></i><div><strong>剧情模式自由探索</strong><small>不引入时间压力、敌情推进或拖延关门。</small></div></li><li class="row"><i class="dot current"></i><div><strong>源文件优先</strong><small>Markdown、图片、Unity 资产是权威源；管理台只管理索引与状态。</small></div></li><li class="row"><i class="dot current"></i><div><strong>Unity 验证</strong><small>脚本修改后重新编译并检查 Console；不自动保存场景。</small></div></li></ul></article></div>`;bindGoto()}
function renderTasks(){let groups=[['current','当前进行'],['next','接下来'],['later','之后']];$('#tasks').innerHTML=`<div class="section-title"><h2>开发看板</h2><span>拖延不是状态；每项必须有验收与解锁条件</span></div><div class="toolbar"><button class="btn primary" id="addTask">+ 新增任务</button><button class="btn" id="exportData">导出管理索引</button><label class="btn">导入索引<input id="importData" type="file" accept="application/json" hidden></label><button class="btn danger" id="resetData">恢复项目初始索引</button></div><div class="board">${groups.map(([s,title])=>`<section class="column"><h3>${title}</h3>${data.tasks.filter(t=>t.status===s).map(taskCard).join('')||'<div class="empty">暂无任务</div>'}</section>`).join('')}</div>`;$('#addTask').onclick=()=>openTaskModal();$('#exportData').onclick=()=>download('OCC_项目管理索引.json',JSON.stringify(data,null,2));$('#resetData').onclick=()=>{if(confirm('恢复初始索引？本地编辑会丢失。')){data=structuredClone(base);save('已恢复初始索引');renderAll()}};$('#importData').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save('已导入索引');renderAll()}catch{alert('文件不是有效的项目索引 JSON。')}};r.readAsText(f)};}
function renderAssets(){let types=[...new Set(data.assets.map(a=>a.type))];$('#assets').innerHTML=`<div class="section-title"><h2>美术与资源资产库</h2><span>状态管理：参考 ≠ 待规范化 ≠ 正式可用</span></div><div class="toolbar"><input id="assetSearch" placeholder="搜索资产、类型、说明"><select id="assetType"><option value="">全部类型</option>${types.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn primary" id="addAsset">+ 登记资产</button></div><div class="asset-grid" id="assetGrid"></div>`;const draw=()=>{let q=$('#assetSearch').value.toLowerCase(),type=$('#assetType').value;let list=data.assets.filter(a=>(!type||a.type===type)&&JSON.stringify(a).toLowerCase().includes(q));$('#assetGrid').innerHTML=list.map(a=>`<article class="asset">${a.path.match(/\.(png|jpg|jpeg)$/i)?`<img src="${esc(a.path)}" alt="${esc(a.name)}">`:'<div style="height:125px;display:grid;place-items:center;color:#91a7a8">无预览</div>'}<div class="body"><h4>${esc(a.name)}</h4><p>${esc(a.type)} · ${esc(a.note)}</p><footer><span class="state ${esc(a.status)}">${stateName(a.status)}</span><span>${esc(a.owner)}</span></footer></div></article>`).join('')||'<div class="empty">没有匹配资产</div>'};$('#assetSearch').oninput=draw;$('#assetType').onchange=draw;$('#addAsset').onclick=()=>openAssetModal();draw();}
function renderGaps(){let groups=['P0','P1'];$('#gaps').innerHTML=`<div class="section-title"><h2>资产缺口与依赖</h2><span>缺口必须绑定开发任务，不做孤立愿望清单</span></div><div class="toolbar"><button class="btn primary" id="addGap">+ 登记缺口</button><input id="gapSearch" placeholder="搜索缺口、区域、类型"></div><div id="gapTable"></div>`;const draw=()=>{let q=$('#gapSearch').value.toLowerCase();$('#gapTable').innerHTML=groups.map(p=>{let list=data.gaps.filter(g=>g.priority===p&&JSON.stringify(g).toLowerCase().includes(q));return `<div class="section-title"><h2>${p} 缺口</h2><span>${list.length} 项</span></div><table class="table"><thead><tr><th>绑定区域/任务</th><th>缺口</th><th>类型</th><th>状态</th><th>为什么需要</th></tr></thead><tbody>${list.map(g=>`<tr><td>${esc(g.area)}</td><td>${esc(g.item)}</td><td>${esc(g.kind)}</td><td><span class="state ${esc(g.status)}">${stateName(g.status)}</span></td><td>${esc(g.need)}</td></tr>`).join('')||'<tr><td colspan="5">暂无</td></tr>'}</tbody></table>`}).join('')};$('#gapSearch').oninput=draw;$('#addGap').onclick=()=>openGapModal();draw();}
function renderDesign(){let done=data.decisions.filter(d=>d[1]!=='待确认').length;$('#design').innerHTML=`<div class="section-title"><h2>设定与产品决策</h2><span>只记录结论与来源；正文仍维护在 Worldbuilding 源文件</span></div><div class="kpi"><div><small>已记录决定</small><b>${data.decisions.length}</b></div><div><small>已确定 / 锁定</small><b>${done}</b></div><div><small>待确认</small><b>${data.decisions.filter(d=>d[1]==='待确认').length}</b></div></div><div class="section-title"><h2>决策台账</h2><span>下一次策划变动先修改源文档，再同步此处</span></div><table class="table"><thead><tr><th>主题</th><th>状态</th><th>当前结论</th></tr></thead><tbody>${data.decisions.map(d=>`<tr><td>${esc(d[0])}</td><td><span class="state ${d[1]==='待确认'?'planned':'ready'}">${esc(d[1])}</span></td><td>${esc(d[2])}</td></tr>`).join('')}</tbody></table>`}
function renderQuality(){let complete=1;$('#quality').innerHTML=`<div class="section-title"><h2>风险、验证与质量门</h2><span>风险需要对应防线；验证需要对应验收项</span></div><div class="two"><article class="card"><div class="eyebrow">当前风险</div>${data.risks.map(r=>`<div class="risk ${r.level==='high'?'high':''}"><strong>${esc(r.name)} · ${r.level==='high'?'高':'中'}风险</strong><p>${esc(r.mitigation)}</p></div>`).join('')}</article><article class="card"><div class="eyebrow">下一个质量门</div><h2 style="margin:8px 0">${esc(data.tasks[0].id)} 验收</h2><p class="detail">${esc(data.tasks[0].accept)}</p><ul class="list"><li class="row"><i class="dot current"></i><div><strong>规则层测试</strong><small>新增任务目标必须有 EditMode 覆盖。</small></div></li><li class="row"><i class="dot current"></i><div><strong>确定性验证</strong><small>克隆/战术重开后目标状态与结算完全一致。</small></div></li><li class="row"><i class="dot current"></i><div><strong>Unity 验证</strong><small>脚本改动后重新编译并检查 Console。</small></div></li></ul></article></div><div class="section-title"><h2>验证记录</h2><span>${complete} 条已有记录</span></div><table class="table"><thead><tr><th>日期</th><th>对象</th><th>结果</th><th>备注</th></tr></thead><tbody><tr><td>2026-07-21</td><td>策划与玩法问卷</td><td><span class="state ready">通过</span></td><td>产品、探索和成长方向已同步至总流程草案。</td></tr></tbody></table>`}
function renderDocs(){let groups={};data.docs.forEach(d=>(groups[d[3]]??=[]).push(d));$('#docs').innerHTML=`<div class="section-title"><h2>文档中枢</h2><span>直接打开权威源文件；管理台不替代文档</span></div>${Object.entries(groups).map(([g,docs])=>`<div class="section-title"><h2>${esc(g)}</h2></div><table class="table"><thead><tr><th>文档</th><th>用途</th><th>位置</th></tr></thead><tbody>${docs.map(d=>`<tr><td><a style="color:var(--cyan)" href="${esc(d[2])}">${esc(d[0])}</a></td><td>${esc(d[1])}</td><td><code>${esc(d[2])}</code></td></tr>`).join('')}</tbody></table>`).join('')}`}
function stateName(s){return({missing:'缺失',planned:'已规划',ready:'可用',reference:'概念参考'})[s]||s}function bindGoto(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>openView(b.dataset.goto))}function openView(v){$('#tabs').querySelector(`[data-view="${v}"]`).click()}
function renderAll(){renderOverview();renderTasks();renderAssets();renderGaps();renderDesign();renderQuality();renderDocs()}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function openModal(title,fields,onSave){$('#modalTitle').textContent=title;$('#modalFields').innerHTML=fields.map(f=>`<label>${esc(f.label)}</label>${f.type==='select'?`<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea name="${f.name}" placeholder="${esc(f.placeholder||'')}"></textarea>`:`<input name="${f.name}" placeholder="${esc(f.placeholder||'')}">`}`).join('');$('#modal').classList.add('show');$('#confirm').onclick=()=>{let out={};fields.forEach(f=>out[f.name]=$(`#modal [name="${f.name}"]`).value.trim());if(Object.values(out).some(v=>!v)){alert('请填写所有字段。');return}onSave(out);$('#modal').classList.remove('show');save();renderAll()}}
function openTaskModal(){openModal('新增开发任务',[{name:'id',label:'任务编号',placeholder:'P2-01'},{name:'name',label:'任务名称'},{name:'mode',label:'归属',type:'select',options:['剧情','肉鸽','共用']},{name:'priority',label:'优先级',type:'select',options:['P0','P1','P2']},{name:'status',label:'看板列',type:'select',options:['next','later']},{name:'desc',label:'目标说明',type:'textarea'},{name:'accept',label:'验收标准',type:'textarea'},{name:'next',label:'完成后解锁'}],x=>data.tasks.push(x))}function openAssetModal(){openModal('登记资产',[{name:'name',label:'资产名称'},{name:'type',label:'类型'},{name:'status',label:'状态',type:'select',options:['reference','planned','ready']},{name:'owner',label:'来源/负责人'},{name:'path',label:'相对路径',placeholder:'../../Art/...'},{name:'note',label:'说明',type:'textarea'}],x=>data.assets.push(x))}function openGapModal(){openModal('登记资产缺口',[{name:'area',label:'绑定区域/任务'},{name:'item',label:'缺口名称'},{name:'kind',label:'类型'},{name:'priority',label:'优先级',type:'select',options:['P0','P1','P2']},{name:'status',label:'状态',type:'select',options:['missing','planned']},{name:'need',label:'需要原因',type:'textarea'}],x=>data.gaps.push(x))}
$('#cancel').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('show')};$('#tabs').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===e.target));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===e.target.dataset.view))};renderAll();
</script></body></html>
