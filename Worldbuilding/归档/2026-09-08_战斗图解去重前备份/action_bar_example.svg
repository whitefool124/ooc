<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15252a"/>
      <stop offset="1" stop-color="#26333a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/></filter>
  </defs>
  <rect x="20" y="20" width="1000" height="480" rx="30" fill="url(#bg)"/>
  <text x="70" y="78" fill="#f4e8c9" font-size="34" font-weight="700">行动条例子</text>
  <text x="70" y="116" fill="#a8bcc2" font-size="22">同样经过 20 个时间单位</text>

  <text x="76" y="190" fill="#e9dfc6" font-size="25">速度 10</text>
  <line x1="230" y1="180" x2="900" y2="180" stroke="#35545c" stroke-width="14" stroke-linecap="round"/>
  <line x1="230" y1="180" x2="900" y2="180" stroke="#56c6d2" stroke-width="8" stroke-linecap="round"/>
  <circle cx="230" cy="180" r="15" fill="#f4e8c9"/>
  <circle cx="565" cy="180" r="24" fill="#56c6d2" filter="url(#shadow)"/>
  <circle cx="900" cy="180" r="24" fill="#56c6d2" filter="url(#shadow)"/>
  <text x="565" y="232" text-anchor="middle" fill="#f4e8c9" font-size="23">第 1 次行动</text>
  <text x="900" y="232" text-anchor="middle" fill="#f4e8c9" font-size="23">第 2 次行动</text>

  <text x="76" y="306" fill="#e9dfc6" font-size="25">速度 5</text>
  <line x1="230" y1="296" x2="900" y2="296" stroke="#35545c" stroke-width="14" stroke-linecap="round"/>
  <line x1="230" y1="296" x2="900" y2="296" stroke="#d7a84b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="230" cy="296" r="15" fill="#f4e8c9"/>
  <circle cx="900" cy="296" r="24" fill="#d7a84b" filter="url(#shadow)"/>
  <text x="900" y="348" text-anchor="middle" fill="#f4e8c9" font-size="23">第 1 次行动</text>

  <path d="M230 392 H520" fill="none" stroke="#56c6d2" stroke-width="5"/>
  <polygon points="520,392 495,378 495,406" fill="#56c6d2"/>
  <text x="76" y="402" fill="#e9dfc6" font-size="25">溢出</text>
  <text x="565" y="402" fill="#f4e8c9" font-size="27" font-weight="700">125 − 100 = 25</text>
  <text x="565" y="440" fill="#a8bcc2" font-size="22">25 点保留到下一轮</text>
</svg>
