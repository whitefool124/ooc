<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCC · 底栏画面对照</title>
<style>body{margin:24px;background:#282822;color:#eee5d3;font:16px/1.7 system-ui}h1{font-size:26px}button,select{font:inherit;padding:6px 14px;background:#eee5d3;border:2px solid #778477;color:#282822;margin:4px}button[aria-pressed=true]{background:#8ebcbd}#stage{overflow:auto;border:1px solid #706b5d}img{display:block;max-width:none;image-rendering:pixelated}p{max-width:1000px}.muted{color:#c2bcac}</style>
<h1>OCC · 底栏指令可读性</h1><p>移动 / 攻击改为上下两行；图标、名称和行动费用分开。快捷槽使用细框，空槽与占用槽分别排布。以下是生产 UI 的静态渲染，未进入 Play Mode。</p>
<div><select id="resolution" aria-label="分辨率"><option value="960">960 × 540 · 原始像素</option><option value="1920">1920 × 1080 · 原始像素</option></select><button data-mode="overview">修改前</button><button data-mode="after" aria-pressed="true">修改后 · 空槽</button><button data-mode="occupied">修改后 · 占用槽</button></div>
<p id="caption"></p><div id="stage"><img id="shot" alt="OCC 战场与底栏静态渲染"></div>
<p class="muted">占用槽使用临时内存道具样本，不写入存档。两档分别由 Unity 渲染，非图片缩小。首次静态刷新未推进范围淡入和动作时钟，因此不能用这些图片验收动态范围、飘字和实际交互。水面与灯藤 v3 仍待重新审核，批准 0/2。</p>
<p>后续重点：右栏摘要下边距、相邻单位拥挤度、石材与灯藤重复感、动态演出和完整流程。</p>
<script>let mode='after';const size=document.querySelector('#resolution');function draw(){document.querySelector('#shot').src=mode+'_'+size.value+'.png';document.querySelector('#caption').textContent=size.options[size.selectedIndex].text+' · '+({overview:'修改前',after:'修改后：固定首战空槽',occupied:'修改后：临时占用槽样本'}[mode]);document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}size.onchange=draw;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});draw();</script></html>
