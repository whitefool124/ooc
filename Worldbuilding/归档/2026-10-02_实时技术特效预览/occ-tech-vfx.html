<div id="occ-tech-vfx">
  <div class="viz-row" aria-label="特效选择">
    <button class="btn" type="button" data-effect="0">护幕受击</button>
    <button class="btn" type="button" data-effect="1">护幕碎裂</button>
    <button class="btn" type="button" data-effect="2">以太消解</button>
    <button class="btn" type="button" data-effect="3">空间冲击</button>
    <button class="btn" type="button" data-effect="4">像素折射</button>
    <button class="btn" type="button" data-effect="5">移动光源</button>
    <button class="btn btn-primary" type="button" data-effect="6">护盾光效</button>
  </div>
  <canvas width="320" height="180" role="img" aria-label="OCC角色与地面上的实时护盾折射、命中光照和移动光源演示"></canvas>
  <div class="viz-row">
    <button class="btn" type="button" data-replay>再播放一次</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-slow><span class="form-check-label">慢放</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-original><span class="form-check-label">查看原画面</span></label>
    <span aria-live="polite" data-status>护盾光效 · 点击护盾可改变命中位置</span>
  </div>
  <label class="form-label" for="occ-vfx-phase">演出进度</label>
  <input class="form-range" id="occ-vfx-phase" type="range" min="0" max="4800" value="0" step="10">
</div>

let current=6,start=-1,raf=0,hit=[181,86],lastAge=-1,manualAge=null;
const names=['护幕受击','护幕碎裂','以太消解','空间冲击','像素折射','移动光源','护盾光效'];
function draw(now){let elapsed=manualAge!==null?manualAge:(start<0?-1:(now-start)/1000/(root.querySelector('[data-slow]').checked?3:1));lastAge=elapsed;gl.uniform1f(uniforms.age,elapsed);gl.uniform1f(uniforms.mode,current);gl.uniform1f(uniforms.original,root.querySelector('[data-original]').checked?1:0);gl.uniform2fv(uniforms.hit,hit);gl.drawArrays(gl.TRIANGLES,0,6);root.dataset.mode=String(current);root.dataset.age=String(elapsed);if(manualAge===null)root.querySelector('#occ-vfx-phase').value=String(Math.max(0,elapsed)*1000);if(start>=0&&elapsed<(current>=4?4.8:2.4))raf=requestAnimationFrame(draw);else{start=-1;raf=0;}}
function play(){cancelAnimationFrame(raf);manualAge=null;start=performance.now();draw(start);status.textContent=names[current]+' · '+(current===0||current===6?'点击护盾可改变命中位置':'实时演示');}
for(const b of root.querySelectorAll('[data-effect]'))b.addEventListener('click',()=>{current=Number(b.dataset.effect);for(const peer of root.querySelectorAll('[data-effect]')){peer.classList.toggle('btn-primary',peer===b);peer.setAttribute('aria-pressed',String(peer===b));}play();});
root.querySelector('[data-replay]').addEventListener('click',play);root.querySelector('[data-slow]').addEventListener('change',play);root.querySelector('[data-original]').addEventListener('change',()=>{if(!raf)draw(performance.now());});
root.querySelector('#occ-vfx-phase').addEventListener('input',e=>{cancelAnimationFrame(raf);raf=0;start=-1;manualAge=Number(e.target.value)/1000;draw(performance.now());status.textContent=names[current]+' · '+Math.round(manualAge*1000)+'ms';});
canvas.addEventListener('pointerdown',e=>{if(current===0||current===6){const r=canvas.getBoundingClientRect();const q=[(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*180];const d=[(q[0]-160)/27,(q[1]-94)/38];const len=Math.hypot(...d);hit=len>1?[160+d[0]/len*26,94+d[1]/len*37]:q;play();}});
draw(performance.now());root.dataset.ready='true';
}).catch(e=>{status.textContent='素材加载失败：'+e.message;root.dataset.error=String(e);});
}catch(e){status.textContent='着色器编译失败：'+e.message;root.dataset.error=String(e);}
})();
</script>
