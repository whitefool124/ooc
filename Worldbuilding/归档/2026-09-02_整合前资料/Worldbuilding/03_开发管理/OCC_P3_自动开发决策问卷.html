    footer { padding:24px 0 50px; color:var(--muted); } @media (max-width:720px) { .section-body { grid-template-columns:1fr; } .question.full { grid-column:auto; } #progress { margin-left:0; width:100%; } }

<body>
  <header><h1>OCC / P3 自动开发决策问卷</h1><p class="lede">用途：锁定“肉鸽故事包与任务模板开发菜单入口”的产品规则与验收边界。答案会被转为策划约束、待办验收项和实现任务；未回答的必答项将阻止进入自动开发。</p><p class="warn">既有硬约束：剧情模式绝不加入时间压力、敌情推进、倒计时或拖延关闭地点；肉鸽进度不得污染剧情存档；本问卷不授权替换正式美术资产。</p></header>
  <main><div class="toolbar"><button class="primary" type="button" id="save">保存本机草稿</button><button type="button" id="exportJson">导出 JSON</button><button type="button" id="exportMd">导出 Markdown</button><label class="file-label">导入 JSON<input id="import" type="file" accept="application/json" hidden></label><button type="button" id="reset">清空本页</button><span id="progress"></span></div><div id="status" class="status">问卷加载完成；请优先填写带青色边线的必答项。</div><form id="survey"></form><footer>提交方式：保存草稿后，可将导出的 JSON 文件交给我，或直接将 Markdown 内容粘贴到聊天中。若某项暂未决定，请明确填写“由 Codex 采用推荐默认值”，不要留空。</footer></main>
  <dialog id="output"><h2 id="outputTitle"></h2><textarea id="outputText" spellcheck="false"></textarea><div class="dialog-actions"><button type="button" id="copy">复制</button><button type="button" id="download">下载</button><button type="button" onclick="output.close()">关闭</button></div></dialog>

const form=document.querySelector('#survey'), key='occ-p3-survey-v1';
function field(q){const [id,type,label,help,opts,required]=q; const cls=`question ${required?'required':''} ${type==='文本'?'full':''}`; let input=''; if(type==='单选'||type==='多选'){input=`<div class="options">${opts.map((o,i)=>`<label><input data-id="${id}" type="${type==='单选'?'radio':'checkbox'}" name="${id}" value="${o}"><span>${o}</span></label>`).join('')}</div>`; if(id==='G02') input+=`<input data-id="${id}" class="other" type="text" placeholder="若选择“再加入”，填写额外分辨率">`; } else { input=`<textarea data-id="${id}" placeholder="${required?'必填：可填写“采用推荐默认值”':''}"></textarea>`; } return `<article class="${cls}"><label class="q"><span class="id">${id}</span>${label}${required?' *':''}</label><span class="help">${help}</span>${input}</article>`; }
sections.forEach((s,i)=>form.insertAdjacentHTML('beforeend',`<section class="section"><div class="section-head"><h2>${String.fromCharCode(65+i)} / ${s.title}</h2><span class="hint">${s.desc}</span></div><div class="section-body">${s.qs.map(field).join('')}</div></section>`));
function values(){const out={version:1,title:'OCC P3 自动开发决策问卷',exportedAt:new Date().toISOString(),answers:{}}; form.querySelectorAll('[data-id]').forEach(el=>{const id=el.dataset.id; if(!out.answers[id])out.answers[id]=[]; if((el.type==='radio'||el.type==='checkbox')&&!el.checked)return; if(el.value.trim())out.answers[id].push(el.value.trim());}); return out;}
function apply(data){form.reset(); Object.entries(data.answers||{}).forEach(([id,vs])=>{form.querySelectorAll(`[data-id="${id}"]`).forEach(el=>{if(el.type==='radio'||el.type==='checkbox')el.checked=vs.includes(el.value); else if(el.classList.contains('other')){if(vs.length)el.value=vs[vs.length-1];} else el.value=vs.join('\n');});}); update();}
function requiredMissing(){return sections.flatMap(s=>s.qs).filter(q=>q[5]).filter(q=>!values().answers[q[0]]?.length).map(q=>q[0]);}
function update(){const answered=Object.keys(values().answers).length, total=sections.flatMap(s=>s.qs).length, missing=requiredMissing(); document.querySelector('#progress').textContent=`已答 ${answered}/${total} · 必答缺 ${missing.length}`; const st=document.querySelector('#status'); st.className='status '+(missing.length?'bad':'ok'); st.textContent=missing.length?`尚缺必答项：${missing.join('、')}。可填写“采用推荐默认值”以授权默认裁决。`:'所有必答项已完成，可以导出并交给 Codex 固化为开发约束。'; localStorage.setItem(key,JSON.stringify(values()));}
function markdown(){const v=values(), lines=['# OCC P3 自动开发决策问卷答卷','',`- 导出时间：${v.exportedAt}`,'']; sections.forEach(s=>{lines.push(`## ${s.title}`,''); s.qs.forEach(q=>{const a=v.answers[q[0]]||['（未回答）']; lines.push(`### ${q[0]} ${q[2]}`,'',a.map(x=>`- ${x}`).join('\n'),'');});});return lines.join('\n');}
function show(title,text,name,type){outputTitle.textContent=title;outputText.value=text;output.showModal(); download.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);};}
document.querySelector('#save').onclick=()=>{update();document.querySelector('#status').textContent='草稿已保存到此浏览器的本地存储。'};
document.querySelector('#exportJson').onclick=()=>show('导出 JSON',JSON.stringify(values(),null,2),'OCC_P3_自动开发决策答卷.json','application/json');
document.querySelector('#exportMd').onclick=()=>show('导出 Markdown',markdown(),'OCC_P3_自动开发决策答卷.md','text/markdown');
document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(outputText.value);
document.querySelector('#reset').onclick=()=>{if(confirm('清空本页与本机草稿？')){localStorage.removeItem(key);form.reset();update();}};
document.querySelector('#import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{apply(JSON.parse(r.result));}catch(_){alert('不是有效的问卷 JSON 文件。');}};r.readAsText(f,'utf-8');};
form.addEventListener('input',update); const saved=localStorage.getItem(key); if(saved)try{apply(JSON.parse(saved));}catch(_){update();}else update();
</script></body></html>
