  <g id="schedule-panel">
    <rect class="panel" x="2490" y="130" width="1040" height="1320" rx="12"/>
    <text class="panelTitle" x="2530" y="180">总量与生产口径</text>
    <text class="label" x="2530" y="230">6,240 常住｜6,880 学期峰值｜4,960 栋建筑</text>
    <text class="small" x="2530" y="264">居住建筑 2,080 栋，平均 3.0 人/栋；非居住建筑 2,880 栋</text>
    <text class="small" x="2530" y="294">1F 893｜2F 2,331｜3F 1,438｜4F 248｜5F 50</text>
    <path class="boundary" d="M2530 320H3490"/>

    <text class="panelTitle" x="2530" y="365">区域表示法</text>
    <rect x="2530" y="390" width="120" height="64" fill="url(#res-a)" stroke="#215879"/><text class="small" x="2670" y="416">UR 排屋／商住肌理区</text><text class="tiny" x="2670" y="442">数量在区域标签闭合；边缘须使用转角变体</text>
    <rect x="2530" y="475" width="120" height="64" fill="url(#res-b)" stroke="#215879"/><text class="small" x="2670" y="501">UR 围院／宿舍肌理区</text><text class="tiny" x="2670" y="527">每院双出口，保留中庭与消防巷</text>
    <rect x="2530" y="560" width="120" height="64" fill="url(#work)" stroke="#215879"/><text class="small" x="2670" y="586">NR 工坊／非居住生产区</text><text class="tiny" x="2670" y="612">长跨屋面、材料院、危险品隔离</text>
    <rect x="2530" y="645" width="120" height="64" fill="url(#academic)" stroke="#215879"/><text class="small" x="2670" y="671">NR 学院／公共院落区</text><text class="tiny" x="2670" y="697">地标逐栋，附属房按区域清册生成</text>
    <path class="boundary" d="M2530 738H3490"/>

    <text class="panelTitle" x="2530" y="782">道路与退界</text>
    <text class="small" x="2530" y="820">RD-A01 东西轴：32m 红线＝16m 车行＋双侧步行／排水</text>
    <text class="small" x="2530" y="852">RD-A02 南北轴：28m 红线；图书馆环路 18m</text>
    <text class="small" x="2530" y="884">分区主街 14–18m｜普通街 8–12m｜服务巷 3–6m</text>
    <text class="small" x="2530" y="916">退界：住宅 0–3m｜教学 8–12m｜工坊 8–16m｜仓储 12–20m</text>
    <text class="small" x="2530" y="948">图书馆退界 24m；道路交叉优先丁字／错位十字</text>
    <path class="boundary" d="M2530 976H3490"/>

    <text class="panelTitle" x="2530" y="1020">市政与防御</text>
    <path class="utility" d="M2535 1055h80"/><text class="small" x="2635" y="1061">给水干线；北部双池各 2,400m³</text>
    <path class="drain" d="M2535 1090h80"/><text class="small" x="2635" y="1096">盖板排水；主渠坡度 ≥0.4%</text>
    <path class="aether" d="M2535 1125h80"/><text class="small" x="2635" y="1131">有限以太维护回路；非全城自动网络</text>
    <text class="small" x="2530" y="1175">城墙：基宽 12–14m｜高 9–12m｜外壕 18–24m×4–6m</text>
    <text class="small" x="2530" y="1207">内清障 32m｜外清障 48–64m｜四门八塔｜分段人工维护</text>
    <text class="small" x="2530" y="1239">公共井服务半径 ≤180m｜消防所响应距离 ≤450m</text>
    <path class="boundary" d="M2530 1268H3490"/>

    <text class="panelTitle" x="2530" y="1310">动态层硬限制</text>
    <text class="small" x="2530" y="1345">节点安全圆 R≥48m；主路线中心线两侧各 24m 最高投影净空</text>
    <text class="small" x="2530" y="1377">区域图案、建筑模型和 SVG 均不得烘焙节点、路线、状态或点击区</text>
    <text class="tiny" x="2530" y="1415">图纸状态：结构候选／未接入 Unity／批准后仍须先补测试</text>
  </g>

  <g id="details">
    <text class="title" x="70" y="1540">典型断面与地块控制摘要</text>
    <rect class="panel" x="70" y="1580" width="1100" height="690"/>
    <text class="panelTitle" x="105" y="1625">A-A 城市主街 32 m 红线</text>
    <rect x="115" y="1940" width="1000" height="36" fill="#dceef6"/><rect x="310" y="1880" width="610" height="96" fill="#fff" stroke="#245a79"/><line x1="615" y1="1880" x2="615" y2="1976" stroke="#407f9f" stroke-dasharray="8 6"/>
    <path class="drain" d="M245 1930h65M920 1930h65"/><rect class="landmark" x="120" y="1800" width="150" height="140"/><path class="roof" d="M120 1800l75-35 75 35"/><rect class="landmark" x="960" y="1800" width="150" height="140"/><path class="roof" d="M960 1800l75-35 75 35"/>
    <text class="small" x="380" y="1860">16m 双向车行</text><text class="tiny" x="145" y="2008">3m退界</text><text class="tiny" x="240" y="2008">5m步行/排水</text><text class="tiny" x="940" y="2008">5m步行/排水</text><text class="tiny" x="1030" y="2008">3m退界</text>
    <line class="dim" x1="310" y1="2050" x2="920" y2="2050"/><text class="small" x="555" y="2080">16 m</text><line class="dim" x1="115" y1="2120" x2="1115" y2="2120"/><text class="small" x="570" y="2150">32 m 红线</text>
    <text class="small" x="105" y="2220">住宅面宽 6–10m；首层门窗直接面街，后侧由 3–6m 服务巷清运。</text>

    <rect class="panel" x="1200" y="1580" width="1100" height="690"/>
    <text class="panelTitle" x="1235" y="1625">B-B 典型住宅街坊 192 × 160 m</text>
    <rect x="1270" y="1670" width="950" height="500" fill="#e7f2f8" stroke="#245a79" stroke-width="3"/>
    <path class="road2" d="M1270 1920H2220M1745 1670V2170"/>
    <rect x="1300" y="1700" width="410" height="180" fill="url(#res-a)" stroke="#215879"/><rect x="1780" y="1700" width="410" height="180" fill="url(#res-b)" stroke="#215879"/><rect x="1300" y="1960" width="410" height="180" fill="url(#res-b)" stroke="#215879"/><rect x="1780" y="1960" width="410" height="180" fill="url(#res-a)" stroke="#215879"/>
    <rect x="1655" y="1700" width="22" height="180" fill="#d4eef6"/><rect x="1815" y="1960" width="22" height="180" fill="#d4eef6"/>
    <text class="tiny" x="1320" y="1730">6m 防火缝 / 每72–96m</text><text class="tiny" x="1795" y="1730">围院双出口</text><text class="tiny" x="1320" y="1990">后巷 4–5m</text><text class="tiny" x="1795" y="1990">转角原型，不封死路口</text>
    <text class="small" x="1235" y="2220">覆盖率 42–55%；图案区仍由独立基础、屋脊、门洞、院落和消防缝组成。</text>

    <rect class="panel" x="2330" y="1580" width="1200" height="690"/>
    <text class="panelTitle" x="2365" y="1625">C-C 城防带与维护断面</text>
    <path d="M2380 2040h220l45-70h130l45 70h230l40-145h120l40 145h260" fill="#dfeef5" stroke="#245a79" stroke-width="3"/>
    <rect x="3060" y="1785" width="120" height="255" fill="#fff" stroke="#123f5e" stroke-width="4"/><path class="roof" d="M3060 1785l60-35 60 35"/>
    <path d="M2650 1970q65-95 130 0" fill="#cbeaf4" stroke="#5798ba" stroke-width="3"/>
    <text class="small" x="2380" y="2080">外清障 48–64m</text><text class="small" x="2630" y="2080">壕沟 18–24m / 深4–6m</text><text class="small" x="3030" y="2080">墙基12–14m / 高9–12m</text><text class="small" x="3290" y="2080">内清障32m</text>
    <text class="small" x="2365" y="2150">外壕同时承担暴雨调蓄；墙体按分段人工维修，不依赖持续以太护盾。</text>
    <text class="small" x="2365" y="2190">门楼、钟塔和弩炮平台最高 18–24m；封存塔 5F/冠38m 是独立例外。</text>
