  <g transform="translate(2410 180)">
    <text class="panelTitle" x="0" y="0">LAYER B REGISTER</text>
    <text class="panelText" x="0" y="36">上位：v07 工程控制总平面</text><text class="panelText" x="0" y="62">本层：街坊 / 市政 / 岸线</text><text class="panelText" x="0" y="88">状态：拟实施，未接入 Unity</text>
    <path d="M0 112H500" stroke="#9bb1bf" stroke-width="2"/>
    <text class="panelTitle" x="0" y="152">城市承载</text>
    <text class="panelText" x="0" y="188">36 个主街坊容器</text><text class="panelText" x="0" y="214">街坊建筑：4,700 栋</text><text class="panelText" x="0" y="240">登记常住：6,240</text><text class="panelText" x="0" y="266">学期峰值：6,880</text><text class="panelText" x="0" y="292">全城建筑：4,960 栋</text><text class="panelText" x="0" y="318">居住建筑：2,080 栋</text><text class="panelText" x="0" y="344">2–3F：3,769 栋 / 76%</text>
    <path d="M0 342H500" stroke="#9bb1bf" stroke-width="2"/>
    <text class="panelTitle" x="0" y="382">市政系统</text>
    <text class="panelText" x="0" y="418">2 北部蓄水池 + 7 分区水池</text><text class="panelText" x="0" y="444">6 消防值守所 + 手压泵 / 桶车</text><text class="panelText" x="0" y="470">4 粮仓 + 独立防火带</text><text class="panelText" x="0" y="496">3 主排水渠 + 2 沉淀排口</text><text class="panelText" x="0" y="522">工坊废料院 / 港口检疫仓分离</text>
    <path d="M0 546H500" stroke="#9bb1bf" stroke-width="2"/>
    <text class="panelTitle" x="0" y="586">守备与疏散</text>
    <text class="panelText" x="0" y="622">4 门区守备院</text><text class="panelText" x="0" y="648">北 / 西 / 南 / 东 4 集结场</text><text class="panelText" x="0" y="674">图书馆环路四向疏散</text><text class="panelText" x="0" y="700">任一方向封闭仍保留两条出口</text><text class="panelText" x="0" y="726">不新增玩法门锁或路线规则</text>
    <path d="M0 750H500" stroke="#9bb1bf" stroke-width="2"/>
    <text class="panelTitle" x="0" y="790">岸线控制</text>
    <text class="panelText" x="0" y="826">SH-01..10 按序连接</text><text class="panelText" x="0" y="852">港池段允许石砌岸壁</text><text class="panelText" x="0" y="878">自然岸保留岩岸与潮滩</text><text class="panelText" x="0" y="904">桥台 / 栈桥 / 排口必须引用控制点</text><text class="panelText" x="0" y="930">禁止为单体模型自由扭曲岸线</text>
    <path d="M0 954H500" stroke="#9bb1bf" stroke-width="2"/>
    <text class="panelTitle" x="0" y="994">图例</text>
    <rect class="block" x="0" y="1020" width="28" height="18"/><text class="legend" x="42" y="1034">教学 / 公共街坊</text>
    <rect class="work" x="0" y="1052" width="28" height="18"/><text class="legend" x="42" y="1066">工坊街坊</text>
    <rect class="res" x="0" y="1084" width="28" height="18"/><text class="legend" x="42" y="1098">居民 / 宿舍街坊</text>
    <rect class="market" x="0" y="1116" width="28" height="18"/><text class="legend" x="42" y="1130">市集 / 医务街坊</text>
    <rect class="supply" x="0" y="1148" width="28" height="18"/><text class="legend" x="42" y="1162">供给 / 材料街坊</text>
    <circle class="infra" cx="14" cy="1192" r="9"/><text class="legend" x="42" y="1197">给水 / 消防点</text>
    <path class="drain" d="M0 1224H28"/><text class="legend" x="42" y="1229">排水控制线</text>
  </g>

  <g transform="translate(90 1510)">
    <text class="panelTitle" x="0" y="0">分层说明</text>
    <text class="panelText" x="0" y="40">1. v07 保持为整洁宏观总图；v08 只展开街坊与市政系统，避免道路、建筑、管线和文字全部叠在同一张图上。</text>
    <text class="panelText" x="0" y="70">2. 街坊 ID 是固定底层替换容器，不是肉鸽节点；每个街坊由 3–9 个硬表面体量、院落、窄巷和消防间隔组成。</text>
    <text class="panelText" x="0" y="100">3. 给水、消防、粮仓、排水、检疫和守备均依赖人工操作与维护；以太设备只承担少量局部应急。</text>
    <text class="panelText" x="0" y="130">4. 10 个岸线控制点冻结港池、南门前池和自然海岬关系；港区以外不铺连续码头或成熟工业基础设施。</text>
    <text class="panelText" x="0" y="160">5. 本层尚未进入 Unity；产品确认 v07/v08 后，先转成布局测试数据，再建模、投影、验证。</text>
  </g>
</svg>
