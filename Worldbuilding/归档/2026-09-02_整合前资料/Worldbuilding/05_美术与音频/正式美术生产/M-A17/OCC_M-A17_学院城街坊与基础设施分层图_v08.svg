  <defs>
    <style><![CDATA[
      .bg{fill:#f7fbff}.map{fill:#eef5f8;stroke:#9db5c3;stroke-width:2}.water{fill:#dceff7}.wall{fill:none;stroke:#173f59;stroke-width:10}.zone{fill:none;stroke:#9ab0bd;stroke-width:3}.block{fill:#f8fbfd;stroke:#55788e;stroke-width:2}.blockAlt{fill:#e7f0f5;stroke:#55788e;stroke-width:2}.work{fill:#e3eef4;stroke:#3f6f89;stroke-width:2}.res{fill:#edf3f6;stroke:#6e8797;stroke-width:2}.market{fill:#e5eff3;stroke:#527b8f;stroke-width:2}.supply{fill:#e7f1e2;stroke:#789673;stroke-width:2}.harbor{fill:#deedf4;stroke:#447994;stroke-width:2}.core{fill:#d6eaf5;stroke:#175e85;stroke-width:4}.sealed{fill:#e8e3f3;stroke:#654f82;stroke-width:3}.infra{fill:#f7fbff;stroke:#23799e;stroke-width:3}.grain{fill:#e8f1e3;stroke:#698766;stroke-width:3}.guard{fill:#173f59;stroke:#f7fbff;stroke-width:2}.drain{fill:none;stroke:#5c7f92;stroke-width:4;stroke-dasharray:10 7}.shore{fill:none;stroke:#397f9e;stroke-width:6}.cp{fill:#f7fbff;stroke:#397f9e;stroke-width:3}.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#153349}.sub{font:500 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#557184}.label{font:700 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#153349;text-anchor:middle}.small{font:500 13px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#405f73;text-anchor:middle}.tiny{font:600 11px Consolas,monospace;fill:#31566d;text-anchor:middle}.id{font:700 12px Consolas,monospace;fill:#174f70}.panelTitle{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#153349}.panelText{font:500 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#37566a}.legend{font:600 13px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#37566a}
    ]]></style>
