  <g id="legend">
    <rect class="panel" x="2570" y="130" width="960" height="1390" rx="12"/>
    <text class="panelTitle" x="2610" y="180">地形决定布局</text>
    <text class="small" x="2610" y="220">北部双脊 +52..+96m｜中央鞍部 +28..+38m</text><text class="small" x="2610" y="250">西部缓盆 +14..+30m｜东部台地 +24..+48m</text><text class="small" x="2610" y="280">南部低台地 +8..+22m｜港池 0..+8m</text>
    <path class="majorContour" d="M2610 315q90-35 180 0"/><text class="small" x="2820" y="320">主等高线 10m</text><path class="contour" d="M2610 350q90-35 180 0"/><text class="small" x="2820" y="355">次等高线 5m</text>
    <rect class="steep" x="2610" y="380" width="180" height="55"/><text class="small" x="2820" y="410">坡度 &gt;20%，禁止永久建筑</text>
    <path class="stream" d="M2610 465q90-35 180 0"/><text class="small" x="2820" y="470">天然溪沟，不得无依据全线盖暗渠</text>
    <path class="marsh" d="M2610 500h180v55H2610z"/><text class="small" x="2820" y="530">南部湿地／雨洪滞蓄，不建住宅</text>
    <path d="M2610 590H3490" stroke="#5d98b8" stroke-dasharray="10 7"/>

    <text class="panelTitle" x="2610" y="635">为何不再规整</text>
    <text class="small" x="2610" y="675">• 城墙沿脊肩、断崖与 +12m 稳定地基转折</text>
    <text class="small" x="2610" y="710">• 北门落在天然鞍口，西门落在旧渡口</text>
    <text class="small" x="2610" y="745">• 港区位于主墙外低地，以港墙和水障独立防守</text>
    <text class="small" x="2610" y="780">• 街坊是扇形、梯形和沿溪弧形，不再六块矩形</text>
    <text class="small" x="2610" y="815">• 建筑对齐局部街道／等高线，不对齐全城坐标轴</text>
    <path d="M2610 850H3490" stroke="#5d98b8" stroke-dasharray="10 7"/>

    <text class="panelTitle" x="2610" y="895">道路网络</text>
    <path class="roadMajor" d="M2610 935q90-35 180 0"/><path class="roadCenter" d="M2610 935q90-35 180 0"/><text class="small" x="2820" y="940">历史主路 14–22m，坡度≤6–7%</text>
    <path class="road" d="M2610 980q90-35 180 0"/><text class="small" x="2820" y="985">分区连接街 10–18m，顺等高线</text>
    <path class="street" d="M2610 1025q90-35 180 0"/><text class="small" x="2820" y="1030">普通街 8–14m，Y形／偏置T形路口</text>
    <path class="alley" d="M2610 1070q90-35 180 0"/><text class="small" x="2820" y="1075">服务巷 3–6m，连接清运与消防回转点</text>
    <text class="small" x="2610" y="1120">超过10%坡度改梯道；任何道路不得切穿山脊、溪沟或建筑。</text>
    <path d="M2610 1150H3490" stroke="#5d98b8" stroke-dasharray="10 7"/>

    <text class="panelTitle" x="2610" y="1195">真实工程门槛</text>
    <text class="small" x="2610" y="1235">建筑平台横向高差≤2.4m｜挡土墙单级≤3.0m</text>
    <text class="small" x="2610" y="1270">住宅地坪≥+9.5m｜医务／粮仓≥+12m</text>
    <text class="small" x="2610" y="1305">道路纵坡：主路≤7%｜普通坡街≤10%｜港路≤4%</text>
    <text class="small" x="2610" y="1340">西泉保护带120m｜工坊废水不得进入生活水系</text>
    <text class="small" x="2610" y="1375">节点安全圆R≥48m；节点高度由地形／平台采样</text>
    <text class="tiny" x="2610" y="1435">人口与建筑数不变：6,240常住／6,880峰值／4,960栋</text>
    <text class="tiny" x="2610" y="1470">状态：地形优先结构候选｜未接入 Unity</text>
  </g>

  <g id="sections">
    <text class="title" x="70" y="1585">地形—道路—街坊剖面控制</text>
    <rect class="panel" x="70" y="1625" width="1080" height="665"/>
    <text class="panelTitle" x="105" y="1670">A-A 北脊—鞍部—港池纵剖面</text>
    <path d="M110 2150C220 1900 350 1780 460 1880s160 250 270 160 150-160 220-40 80 130 160 150" fill="#dfeef4" stroke="#285d7b" stroke-width="3"/>
    <path class="road" d="M120 2110C250 1880 350 1840 460 1915s160 205 270 120 160-110 240-5 80 130 140 160"/><path class="roadCenter" d="M120 2110C250 1880 350 1840 460 1915s160 205 270 120 160-110 240-5 80 130 140 160"/>
    <text class="small" x="125" y="2190">北脊 +80m</text><text class="small" x="415" y="2190">图书馆鞍部 +34m</text><text class="small" x="750" y="2190">南湿地 +8m</text><text class="small" x="965" y="2190">港池 +2m</text>
    <text class="tiny" x="105" y="2260">道路用连续缓坡绕开陡坎；不以高架或巨型填方强行拉直。</text>

    <rect class="panel" x="1180" y="1625" width="1120" height="665"/>
