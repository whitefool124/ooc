    <path class="stream" d="M1450 2110v90"/><text class="small" x="1240" y="2200">一级台地</text><text class="small" x="1530" y="2200">挡土≤3m</text><text class="small" x="1820" y="2200">建筑横向高差≤2.4m</text>
    <text class="tiny" x="1215" y="2260">房屋沿局部街道切线分段折转；不得用统一巨型基座抹平坡地。</text>

